<style>
:root{color-scheme:dark;--bg:#101820;--panel:#18232c;--line:#31414d;--text:#e9efef;--muted:#91a1ac;--active:#86d9d1;--warm:#ffbf69}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--active);outline-offset:4px}button:disabled{opacity:.2;cursor:default}button{color:inherit}#map{max-width:1500px;margin:auto;padding:28px 5vw 14px}#actors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px;list-style:none;margin:0;padding:0}.actor{min-width:0;position:relative}.actor:not(:last-child):after{content:'→';position:absolute;right:-20px;top:16px;color:var(--muted)}.actor-head{display:flex;align-items:center;gap:10px;min-height:48px;color:var(--muted);transition:color .15s}.actor-head svg{width:32px;height:32px;flex:none;stroke:currentColor;stroke-width:1.5;fill:none}.actor-head span{font-size:clamp(12px,1.3vw,18px)}.actor.lit>.actor-head{color:var(--active)}.tree{list-style:none;margin:12px 0 0 15px;padding:0 0 0 16px;border-left:1px solid var(--line)}.tree .tree{margin-top:4px;margin-bottom:7px}.branch{margin:5px 0;position:relative}.branch:before{content:'';position:absolute;width:10px;left:-16px;top:13px;border-top:1px solid var(--line)}.branch button{border:0;background:none;padding:4px 6px;border-radius:3px;text-align:left;line-height:1.25;font-size:clamp(11px,1.05vw,15px);color:var(--muted)}.branch.current>button{color:var(--active);background:#86d9d114}.branch.ancestor>button{color:var(--text)}.branch.new>button{box-shadow:inset 2px 0 var(--active)}.branch button small{color:var(--muted);font-size:10px;margin-left:5px}.tree[hidden]{display:none}#stage{max-width:1350px;margin:auto;padding:24px 6vw 85px;min-height:460px;display:flex;align-items:center;justify-content:center}#scene{width:100%;min-width:0}.flow{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap}.tile{min-width:130px;max-width:100%;padding:22px 24px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:center;position:relative}.tile.on{border-color:var(--active);background:#86d9d10a}.tile .symbol{display:block;margin:0 auto 14px;width:54px;height:54px;stroke:currentColor;fill:none;stroke-width:1.5;color:var(--muted)}.tile.on .symbol{color:var(--active)}.tile strong{display:block;font-size:clamp(16px,2vw,25px);font-weight:500}.tile small{display:block;color:var(--muted);margin-top:10px;font-size:14px}.arrow{font-size:28px;color:var(--muted)}.document{max-width:720px;margin:auto;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}.doc-part{padding:20px 28px;border-left:4px solid transparent}.doc-part+ .doc-part{border-top:1px solid var(--line)}.doc-part.on{border-left-color:var(--active);background:#86d9d10a}.doc-part small{display:block;color:var(--muted);margin-bottom:12px;font-size:13px}.mono,pre,code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.doc-part pre{margin:0;font-size:clamp(14px,1.7vw,23px);line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.stack{display:grid;gap:18px;max-width:820px;margin:auto}.columns{display:grid;grid-template-columns:1fr 1fr;gap:28px}.group{padding:18px 22px;border-left:2px solid var(--line)}.group.on{border-color:var(--active)}.tag{color:var(--muted);font-size:14px;margin-bottom:14px;display:block}.label{font-size:clamp(18px,2vw,28px);font-weight:500}.subtle{color:var(--muted)}.code-block{padding:24px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:clamp(13px,1.65vw,22px);line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 auto;max-width:850px}.conversation{max-width:850px;margin:auto;display:grid;gap:8px}.utterance{padding:9px 18px;font:clamp(13px,1.6vw,21px)/1.5 ui-monospace,monospace;color:var(--muted);border-left:2px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.utterance.server{margin-left:12%;border-color:#52606c}.utterance.on{color:var(--active);border-color:var(--active)}.symbol-large{width:160px;height:160px;stroke:var(--active);fill:none;stroke-width:1}.hero-mail{display:flex;align-items:center;justify-content:center;gap:30px}.hero-mail .line{height:1px;background:var(--line);width:min(16vw,160px)}.legend{text-align:center;color:var(--muted);margin-top:22px;font-size:14px}.rule{border:1px solid var(--line);padding:25px;text-align:center;border-radius:8px;font-size:clamp(18px,2.4vw,32px)}.rule em{font-style:normal;color:var(--active)}.ports{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.port{padding:20px;text-align:center;border-bottom:1px solid var(--line)}.port b{font-size:32px;font-weight:500;display:block;color:var(--active)}.port span{display:block;color:var(--muted);margin-top:8px}footer{position:fixed;bottom:0;left:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:9px 18px;background:var(--bg);z-index:5;gap:8px;font-size:12px;color:var(--muted)}footer button{border:0;background:transparent;padding:9px 11px;min-width:36px;color:var(--muted);border-radius:3px}footer button:hover{color:var(--text);background:var(--panel)}footer .commands{display:flex;align-items:center;gap:2px}#position{font-variant-numeric:tabular-nums}#live{position:absolute;left:-10000px}dialog{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;width:min(900px,92vw);max-height:86vh;padding:24px}dialog::backdrop{background:#000b}dialog header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}dialog header h2{margin:0;font-size:20px;font-weight:500}dialog button{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:9px 12px}#contents{list-style:none;padding:0;margin:0;display:grid;gap:8px}#contents button{text-align:left;width:100%;color:var(--text)}#contents small{color:var(--muted);display:block;margin:4px 0}#notes-content{font-size:18px;line-height:1.6}#notes-content h1,#notes-content h2{font-size:24px}#notes-content h3{font-size:19px}#notes-content a{color:var(--active)}#notes-content pre{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;padding:15px;background:var(--panel)}#notes-content .eyebrow{color:var(--muted);font-size:13px}#current-topic{color:var(--active);font-size:15px;margin-bottom:20px}.hidden{display:none!important}@media(max-width:700px){#map{padding:18px 14px 10px}#actors{gap:14px}.actor-head{flex-direction:column;align-items:flex-start;gap:7px}.actor-head svg{width:24px;height:24px}.actor:not(:last-child):after{right:-11px;top:8px;font-size:12px}.tree{margin-left:0;padding-left:9px}.branch:before{left:-9px;width:6px}.branch button{font-size:11px;padding:5px 2px;overflow-wrap:anywhere}.branch button small{display:none}.tree .tree{margin-left:0}#stage{padding:20px 18px 85px;min-height:340px}.flow{gap:12px}.tile{min-width:110px;padding:16px}.tile .symbol{width:36px;height:36px}.tile small{font-size:12px}.columns{grid-template-columns:1fr;gap:16px}.ports{grid-template-columns:repeat(2,1fr)}footer{padding:6px 8px}footer button{padding:9px}.doc-part{padding:16px}.arrow{font-size:20px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}@media print{footer,dialog{display:none}#map{position:static}body{color:#111;background:white}.actor-head,.branch button{color:#333}.tile,.document,.code-block{background:white;color:#111}}
</style></head>

<script>
const deck=[{"name": "Tout en une phrase", "layer": 1, "visual": "mail", "focus": "", "beats": [], "notes": "\u003cp class=\"lead\">Un email, c’est un \u003cstrong>message sous forme de texte\u003c/strong> qui va de l’appareil de l’expéditeur à celui du destinataire en passant par des ordinateurs intermédiaires qui l’acheminent, le stockent et le filtrent selon des règles communes.\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>30 s. Tout le sujet sans jargon. Les ordinateurs intermédiaires acheminent, stockent et filtrent ; les règles communes permettent leur coopération.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Tout en un paragraphe", "layer": 2, "visual": "overview", "focus": "", "beats": [{"path": "0/message", "label": "Message"}, {"path": "0/message/entetes", "label": "En-têtes"}, {"path": "0/message/corps", "label": "Corps · MIME"}, {"path": "1/soumission", "label": "Soumission"}, {"path": "1/dns", "label": "DNS"}, {"path": "1/smtp", "label": "SMTP"}, {"path": "1/tls", "label": "TLS"}, {"path": "2/auth", "label": "Origine"}, {"path": "2/reputation", "label": "Réputation"}, {"path": "2/filtres", "label": "Filtres"}, {"path": "2/boite", "label": "Boîte aux lettres"}, {"path": "3/lecture", "label": "Consultation"}], "notes": "\u003ch2>Le même email, un peu plus près\u003c/h2>\u003cdiv class=\"prose\">\n\u003cp>Notre application prépare un message sous forme de texte. Ses métadonnées (\u003cstrong>en-têtes\u003c/strong>) indiquent notamment l’expéditeur annoncé, les destinataires et l’objet. Le corps contient le contenu et les éventuelles pièces jointes encodées. L’application confie le message à un \u003cstrong>serveur d’envoi\u003c/strong>, qui peut ajouter des éléments permettant d’en vérifier l’origine.\u003c/p>\n\u003cp>Le serveur consulte l’annuaire des noms de domaine (\u003cstrong>DNS\u003c/strong>) pour trouver le serveur de réception et lui transmet le message (\u003cstrong>SMTP\u003c/strong>). Les deux serveurs peuvent chiffrer leur communication (\u003cstrong>TLS\u003c/strong>).\u003c/p>\n\u003cp>Le service du destinataire vérifie l’origine annoncée, avec des contrôles d’autorisation, d’authenticité et de cohérence des domaines (\u003cstrong>SPF, DKIM, DMARC\u003c/strong>). Il évalue aussi la réputation et le contenu (\u003cstrong>antispam, antivirus\u003c/strong>). Il peut refuser le message, le mettre en quarantaine ou le déposer en boîte, éventuellement dans les indésirables. Le destinataire le consulte dans son application, notamment via \u003cstrong>IMAP\u003c/strong>, ou dans son navigateur (\u003cstrong>webmail\u003c/strong>).\u003c/p>\u003c/div>\u003cp class=\"note\">Trajet courant simplifié. Les relais et les variantes seront détaillés dans la suite.\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>2 min. Lire ou reformuler le paragraphe sans entrer dans les loupes. Il couvre déjà la totalité du trajet, la protection, la confiance et la consultation.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Le trajet en images", "layer": 2, "visual": "overview", "focus": "", "beats": [{"path": "3/lecture/imap", "label": "IMAP"}, {"path": "3/lecture/web", "label": "Webmail"}], "notes": "\u003ch2>Qui fait quoi ?\u003c/h2>\u003cdiv class=\"prose\">\u003cp>Le serveur d’envoi trouve la destination grâce au \u003cstrong>DNS\u003c/strong>, puis transmet le message en \u003cstrong>SMTP\u003c/strong>.\u003c/p>\u003cp>Les serveurs peuvent protéger leur échange avec \u003cstrong>TLS\u003c/strong>. Le service de réception contrôle l’origine et filtre le message.\u003c/p>\u003cp>Le service de réception choisit le traitement. Bob consulte les messages stockés avec son application ou son webmail.\u003c/p>\u003c/div>\u003cp class=\"note\">Schéma logique : un même service peut répartir ces rôles entre plusieurs machines.\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>1 min. Reprendre le même trajet. Toutes les passes gardent les mêmes acteurs et les mêmes positions.\u003c/p>\u003c/aside>", "annex": false}, {"name": "La structure, en une phrase", "layer": 3, "visual": "structure", "focus": "0/message", "beats": [{"path": "0/message/entetes", "label": "En-têtes"}, {"path": "0/message/corps", "label": "Corps · MIME"}], "notes": "\u003ch1>Que contient vraiment un email ?\u003c/h1>\u003cp class=\"lead\">Des \u003cstrong>en-têtes\u003c/strong> qui décrivent le message, une ligne vide, puis un \u003cstrong>corps\u003c/strong> qui porte son contenu.\u003c/p>\u003cp>On ouvre le message d’Alice à Bob, avant de reprendre son trajet.\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>30 s. Première loupe : une phrase avant les détails.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Le message brut", "layer": 3, "visual": "raw", "focus": "0/message", "beats": [{"path": "0/message/entetes/from", "label": "From · To"}, {"path": "0/message/entetes/objet", "label": "Objet · date"}, {"path": "0/message/corps/texte", "label": "Texte"}], "notes": "\u003ch2>Du texte, avant toute mise en forme\u003c/h2>\u003cdiv class=\"split\">\u003cpre>\u003ccode>\u003cspan style=\"color:var(--cyan)\">From: Alice &lt;alice@example.org&gt;\nTo: Bob &lt;bob@example.net&gt;\nDate: Thu, 15 Oct 2026 23:00:00 +0200\nSubject: Reunion de demain\nMessage-ID: &lt;reunion-001@example.org&gt;\u003c/span>\n\nBonjour Bob,\nRendez-vous demain a 10 h.\nAlice\u003c/code>\u003c/pre>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>En haut :\u003c/strong> les en-têtes décrivent le message.\u003c/p>\u003cp>\u003cstrong>La ligne vide\u003c/strong> sépare les en-têtes du corps.\u003c/p>\u003cp>\u003cstrong>En bas :\u003c/strong> le texte que Bob lira.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"note\">Exemple fictif en ASCII, volontairement minimal. Format du message : \u003ca href=\"https://www.rfc-editor.org/rfc/rfc5322#section-2.1\" target=\"_blank\" rel=\"noopener\">RFC 5322, § 2.1\u003c/a>.\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>1 min. Montrer la séparation physique par la ligne vide. From et To sont des déclarations dans le message.\u003c/p>\u003c/aside>", "annex": false}, {"name": "HTML et pièces jointes", "layer": 3, "visual": "mime", "focus": "0/message/corps", "beats": [{"path": "0/message/corps/mime", "label": "MIME"}, {"path": "0/message/corps/html", "label": "Texte / HTML"}, {"path": "0/message/corps/pj", "label": "Pièces jointes"}], "notes": "\u003ch2>Le corps peut contenir plusieurs parties\u003c/h2>\u003cp class=\"prose\">Les extensions \u003cstrong>MIME\u003c/strong> décrivent le type et l’encodage des contenus. Un message peut proposer du texte simple et du HTML, puis joindre un document.\u003c/p>\u003cpre>\u003ccode>multipart/mixed\n  multipart/alternative\n    text/plain       Bonjour Bob…\n    text/html        &lt;p&gt;Bonjour &lt;strong&gt;Bob&lt;/strong&gt;…&lt;/p&gt;\n  application/pdf    reunion.pdf (contenu encodé)\u003c/code>\u003c/pre>\u003cp>Une pièce jointe fait partie du message. Un contenu binaire peut être représenté en caractères avec \u003cstrong>Base64\u003c/strong>.\u003c/p>\u003cp class=\"note\">Structure illustrative, pas un message brut complet. \u003ca href=\"https://www.rfc-editor.org/rfc/rfc2045\">RFC 2045\u003c/a> et \u003ca href=\"https://www.rfc-editor.org/rfc/rfc2046\">RFC 2046\u003c/a>.\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>1 min. La structure MIME est ici une arborescence pédagogique. HTML est du contenu ; Base64 est un encodage.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Message et enveloppe", "layer": 3, "visual": "envelope", "focus": "0/message", "beats": [{"path": "1/smtp/enveloppe", "label": "Enveloppe"}, {"path": "1/smtp/enveloppe/mailfrom", "label": "MAIL FROM"}, {"path": "1/smtp/enveloppe/rcpt", "label": "RCPT TO"}], "notes": "\u003ch2>Le message voyage dans une enveloppe\u003c/h2>\u003cdiv class=\"split\">\u003cdiv>\u003cp class=\"note\">Pendant le dialogue SMTP\u003c/p>\u003cpre>\u003ccode>MAIL FROM:&lt;retours@example.org&gt;\nRCPT TO:&lt;bob@example.net&gt;\nDATA\u003c/code>\u003c/pre>\u003c/div>\u003cdiv>\u003cp class=\"note\">À l’intérieur du message\u003c/p>\u003cpre>\u003ccode>From: Alice &lt;alice@example.org&gt;\nTo: Bob &lt;bob@example.net&gt;\nSubject: Reunion de demain\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003cp>L’enveloppe indique où acheminer le message et à quelle adresse envoyer les notifications d’échec. L’en-tête \u003cstrong>From\u003c/strong> annonce l’auteur du message.\u003c/p>\u003cp>Ces adresses peuvent différer. SPF contrôle notamment le domaine de MAIL FROM. DMARC vérifie l’alignement avec le domaine du From visible via SPF ou DKIM. Cela ne prouve pas l’identité de la personne.\u003c/p>\u003cp class=\"note\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5321#section-3.3\">SMTP : RFC 5321\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc7208\">SPF : RFC 7208\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>1 min. L’enveloppe est transmise dans le dialogue ; elle ne correspond pas nécessairement aux adresses visibles. Prépare SPF et DMARC.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Les traces des serveurs", "layer": 3, "visual": "headers", "focus": "1/smtp", "beats": [{"path": "1/smtp/traces", "label": "Received"}, {"path": "1/signature", "label": "Signature"}, {"path": "2/auth/resultats", "label": "Authentication-Results"}], "notes": "\u003ch2>Les serveurs enrichissent le message\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>Received\u003c/strong> : les serveurs SMTP ajoutent une trace de leur réception.\u003c/p>\u003cp>\u003cstrong>DKIM-Signature\u003c/strong> : un domaine signe des éléments du message pour permettre leur vérification à réception.\u003c/p>\u003cp>\u003cstrong>Authentication-Results\u003c/strong> : un service consigne les résultats de ses vérifications.\u003c/p>\u003cp>Une ligne qui annonce « pass » ne suffit pas. Le service doit savoir \u003cstrong>qui l’a ajoutée\u003c/strong> et à quelles traces il peut se fier.\u003c/p>\u003c/div>\u003cp class=\"note\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5321#section-4.4\">Traces SMTP\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc6376\">DKIM\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8601\">Authentication-Results\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>45 s. Les services ajoutent progressivement des métadonnées. Les traces doivent être interprétées depuis une frontière de confiance.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Le même trajet, avec les acteurs", "layer": 3, "visual": "roles", "focus": "", "beats": [{"path": "0/mua", "label": "MUA"}, {"path": "1/soumission/msa", "label": "MSA"}, {"path": "1/smtp/mta", "label": "MTA"}, {"path": "2/boite/mda", "label": "MDA"}], "notes": "\u003ch2>Le même trajet, avec les acteurs\u003c/h2>\u003cdiv class=\"prose\">\u003cp>Alice prépare le \u003cstrong>message\u003c/strong>. Son service l’achemine vers celui de Bob, qui le contrôle, le filtre et le stocke. Bob le consulte.\u003c/p>\u003cp>Les noms des rôles : \u003cstrong>MUA\u003c/strong> (application), \u003cstrong>MSA\u003c/strong> (soumission), \u003cstrong>MTA\u003c/strong> (transfert), \u003cstrong>MDA\u003c/strong> (distribution).\u003c/p>\u003cp>Le transport peut être chiffré ; l’origine et la réputation restent évaluées à la réception.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5598\" target=\"_blank\" rel=\"noopener\">RFC 5598\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>30 s. Retour à la carte : nous connaissons le contenu. Refaire le trajet entier avant les loupes suivantes. Les rôles ne correspondent pas nécessairement à des machines distinctes.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Déposer, puis relayer", "layer": 3, "visual": "submission", "focus": "1/soumission", "beats": [{"path": "1/soumission/auth", "label": "Authentification"}, {"path": "1/soumission/ports", "label": "465 / 587"}, {"path": "3/lecture/web/https", "label": "HTTPS"}], "notes": "\u003ch2>Déposer, puis relayer\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>Soumission :\u003c/strong> Alice s’authentifie auprès de son service, qui autorise l’envoi.\u003c/p>\u003cpre>\u003ccode>Application → MSA : 465 (TLS implicite)\n                ou 587 (STARTTLS)\nMTA → MTA       : 25 (SMTP, souvent STARTTLS)\u003c/code>\u003c/pre>\u003cp>Avec un webmail, le navigateur utilise \u003cstrong>HTTPS\u003c/strong> ; le service réalise ensuite l’envoi. Une application métier peut aussi utiliser une API.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc6409\" target=\"_blank\" rel=\"noopener\">RFC 6409\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8314\" target=\"_blank\" rel=\"noopener\">RFC 8314\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc5321\" target=\"_blank\" rel=\"noopener\">RFC 5321\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>1 min. Distinguer authentification du compte auprès du service et authentification du domaine à la réception. Ne pas suggérer que tout navigateur parle SMTP.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Trouver le service de Bob", "layer": 3, "visual": "dns", "focus": "1/dns", "beats": [{"path": "1/dns/mx", "label": "MX"}, {"path": "1/dns/ip", "label": "A / AAAA"}], "notes": "\u003ch2>Trouver le service de Bob\u003c/h2>\u003cdiv class=\"prose\">\u003cp>Pour \u003cstrong>bob@example.net\u003c/strong>, le service d’envoi interroge le DNS sur le domaine \u003cstrong>example.net\u003c/strong>.\u003c/p>\u003cpre>\u003ccode>example.net.      MX 10 mx1.example.net.\nexample.net.      MX 20 mx2.example.net.\nmx1.example.net.  A     192.0.2.25\u003c/code>\u003c/pre>\u003cp>Les \u003cstrong>MX\u003c/strong> désignent les serveurs de réception. La préférence la plus basse est prioritaire ; A / AAAA donnent leurs adresses IP.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5321\" target=\"_blank\" rel=\"noopener\">RFC 5321\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>1 min. Exemple fictif. Le DNS ne contient pas la liste des boîtes individuelles. Le service de réception sait ensuite si Bob existe. Variantes : plusieurs MX de même préférence, MX implicite en absence de MX, Null MX en annexe.\u003c/p>\u003c/aside>", "annex": false}, {"name": "SMTP : une conversation", "layer": 3, "visual": "smtp", "focus": "1/smtp", "beats": [{"path": "1/smtp/dialogue", "label": "Dialogue"}, {"path": "1/smtp/dialogue/data", "label": "DATA"}, {"path": "1/smtp/dialogue/accepted", "label": "250 final"}], "notes": "\u003ch2>SMTP : une conversation\u003c/h2>\u003cdiv class=\"prose\">\u003cpre>\u003ccode>S: 220 mx1.example.net\nC: EHLO smtp.example.org\nS: 250 mx1.example.net\nC: MAIL FROM:&lt;retours@example.org&gt;\nS: 250 OK\nC: RCPT TO:&lt;bob@example.net&gt;\nS: 250 OK\nC: DATA\nS: 354 End with &lt;CRLF&gt;.&lt;CRLF&gt;\nC: [en-têtes, ligne vide, corps]\nC: .\nS: 250 2.0.0 Message accepted\u003c/code>\u003c/pre>\u003cp>Le \u003cstrong>250 final\u003c/strong> signifie que le serveur accepte la responsabilité du message. Le placement en boîte principale reste une autre décision.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5321\" target=\"_blank\" rel=\"noopener\">RFC 5321\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>1 min. Dialogue abrégé : TLS, authentification éventuelle et QUIT omis. DATA est terminé par une ligne point ; les points du contenu sont échappés. Un 250 à RCPT TO ne vaut pas acceptation du contenu.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Et si le serveur ne peut pas recevoir ?", "layer": 3, "visual": "queue", "focus": "1/smtp", "beats": [{"path": "1/smtp/file", "label": "File d’attente"}, {"path": "1/smtp/file/retry", "label": "4xx · réessai"}, {"path": "1/smtp/file/bounce", "label": "5xx · échec"}], "notes": "\u003ch2>Et si le serveur ne peut pas recevoir ?\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>2xx :\u003c/strong> succès de la commande. Après DATA, le relais prend le message en charge.\u003c/p>\u003cp>\u003cstrong>4xx :\u003c/strong> échec temporaire. Le serveur d’envoi conserve le message en file et réessaie selon sa politique.\u003c/p>\u003cp>\u003cstrong>5xx :\u003c/strong> échec permanent pour cette tentative. Le service informe normalement l’expéditeur par une notification d’échec.\u003c/p>\u003cp>Un email peut donc être \u003cstrong>retardé\u003c/strong>, et une notification d’échec arriver plus tard.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5321\" target=\"_blank\" rel=\"noopener\">RFC 5321\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc3464\" target=\"_blank\" rel=\"noopener\">RFC 3464\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>45 s. En cas d’expiration de la file après échecs temporaires, une notification peut aussi être émise. Les notifications utilisent normalement une enveloppe vide pour éviter les boucles. SMTP ne garantit pas une livraison exactement une fois.\u003c/p>\u003c/aside>", "annex": false}, {"name": "TLS protège un échange", "layer": 3, "visual": "tls", "focus": "1/tls", "beats": [{"path": "1/tls/starttls", "label": "STARTTLS"}, {"path": "1/tls/politiques", "label": "MTA-STS · DANE"}, {"path": "0/message/chiffrement", "label": "S/MIME · OpenPGP"}], "notes": "\u003ch2>TLS protège un échange\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>En une phrase :\u003c/strong> TLS protège la liaison entre deux interlocuteurs pendant le transport.\u003c/p>\u003cp>STARTTLS fait passer une connexion SMTP en TLS. Entre serveurs, l’usage peut être opportuniste ; \u003cstrong>MTA-STS\u003c/strong> et \u003cstrong>DANE\u003c/strong> permettent de renforcer les exigences lorsque les services les prennent en charge.\u003c/p>\u003cp>Chaque relais termine sa connexion et peut traiter le message. Pour protéger le contenu de bout en bout : \u003cstrong>S/MIME\u003c/strong> ou \u003cstrong>OpenPGP\u003c/strong>.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc3207\" target=\"_blank\" rel=\"noopener\">RFC 3207\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8461\" target=\"_blank\" rel=\"noopener\">RFC 8461\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc7672\" target=\"_blank\" rel=\"noopener\">RFC 7672\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8551\" target=\"_blank\" rel=\"noopener\">RFC 8551\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc9580\" target=\"_blank\" rel=\"noopener\">RFC 9580\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>1 min. Ne pas confondre chiffrement du transport, chiffrement du contenu et authentification du domaine. Les en-têtes nécessaires au routage ne disparaissent pas avec le chiffrement de contenu.\u003c/p>\u003c/aside>", "annex": false}, {"name": "À réception : trois questions", "layer": 3, "visual": "trust", "focus": "2/auth", "beats": [{"path": "2/auth/spf", "label": "SPF"}, {"path": "2/auth/dkim", "label": "DKIM"}, {"path": "2/auth/dmarc", "label": "DMARC"}], "notes": "\u003ch2>À réception : trois questions\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>Autorisation :\u003c/strong> cette adresse IP peut-elle envoyer pour le domaine de l’enveloppe ? \u003cstrong>SPF\u003c/strong>.\u003c/p>\u003cp>\u003cstrong>Signature :\u003c/strong> un domaine a-t-il signé les éléments vérifiés du message ? \u003cstrong>DKIM\u003c/strong>.\u003c/p>\u003cp>\u003cstrong>Cohérence :\u003c/strong> au moins un résultat valide est-il aligné avec le domaine du From visible ? \u003cstrong>DMARC\u003c/strong>.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc7208\" target=\"_blank\" rel=\"noopener\">RFC 7208\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc6376\" target=\"_blank\" rel=\"noopener\">RFC 6376\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc9989\" target=\"_blank\" rel=\"noopener\">RFC 9989\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>45 s. Cette vue couvre déjà les trois mécanismes ; les trois loupes suivantes les reprennent séparément. On authentifie des domaines, pas l’identité humaine d’Alice.\u003c/p>\u003c/aside>", "annex": false}, {"name": "SPF : autoriser les serveurs", "layer": 3, "visual": "spf", "focus": "2/auth/spf", "beats": [{"path": "2/auth/spf/ip", "label": "IP connectée"}, {"path": "2/auth/spf/dns", "label": "Politique DNS"}, {"path": "2/auth/spf/verdict", "label": "Autorisation"}], "notes": "\u003ch2>SPF : autoriser les serveurs\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>En une phrase :\u003c/strong> un domaine publie quels serveurs peuvent utiliser son identité dans l’enveloppe SMTP.\u003c/p>\u003cpre>\u003ccode>example.org. TXT \"v=spf1 ip4:192.0.2.10 -all\"\n\nIP connectée : 192.0.2.10\nMAIL FROM    : retours@example.org\nRésultat     : SPF pass pour example.org\u003c/code>\u003c/pre>\u003cp>Le récepteur compare l’IP du pair SMTP à la politique DNS. SPF ne contrôle pas directement le \u003cstrong>From visible\u003c/strong>.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc7208\" target=\"_blank\" rel=\"noopener\">RFC 7208\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>1 min. Exemple réduit ; la réalité utilise aussi include, ip6, etc. SPF prévoit plusieurs résultats, dont none, neutral, softfail, temperror et permerror. Une redirection change l’IP vue et peut casser SPF. Le cas HELO/enveloppe vide est en annexe.\u003c/p>\u003c/aside>", "annex": false}, {"name": "DKIM : signer des éléments du message", "layer": 3, "visual": "dkim", "focus": "2/auth/dkim", "beats": [{"path": "1/signature/privee", "label": "Clé privée"}, {"path": "2/auth/dkim/publique", "label": "Clé publique DNS"}, {"path": "2/auth/dkim/verifier", "label": "Vérification"}], "notes": "\u003ch2>DKIM : signer des éléments du message\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>En une phrase :\u003c/strong> un domaine ajoute une signature que le destinataire peut vérifier grâce à une clé publique.\u003c/p>\u003cpre>\u003ccode>DKIM-Signature: v=1; d=example.org; s=mail;\n h=from:to:subject:date; bh=…; b=…\n\nClé publique DNS : mail._domainkey.example.org\u003c/code>\u003c/pre>\u003cp>Le service signataire garde la \u003cstrong>clé privée\u003c/strong>. Le récepteur vérifie la signature des en-têtes sélectionnés et le hachage du corps couvert.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc6376\" target=\"_blank\" rel=\"noopener\">RFC 6376\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>1 min. Exemple schématique, pas une signature exploitable. La canonicalisation autorise certaines variations. La signature ne chiffre rien et ne garantit ni innocuité ni signature de tous les champs. Une modification peut invalider DKIM.\u003c/p>\u003c/aside>", "annex": false}, {"name": "DMARC : relier au From visible", "layer": 3, "visual": "dmarc", "focus": "2/auth/dmarc", "beats": [{"path": "2/auth/dmarc/alignement", "label": "Alignement"}, {"path": "2/auth/dmarc/ou", "label": "SPF ou DKIM"}, {"path": "2/auth/dmarc/politique", "label": "Politique"}], "notes": "\u003ch2>DMARC : relier au From visible\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>En une phrase :\u003c/strong> le domaine affiché dans From doit correspondre à un domaine validé par SPF ou DKIM, selon les règles d’alignement.\u003c/p>\u003cpre>\u003ccode>DMARC pass = (SPF pass ET aligné)\n          OU (DKIM pass ET aligné)\n\n_dmarc.example.org. TXT \"v=DMARC1; p=reject\"\u003c/code>\u003c/pre>\u003cp>Le propriétaire publie une préférence en cas d’échec : \u003cstrong>none\u003c/strong>, \u003cstrong>quarantine\u003c/strong> ou \u003cstrong>reject\u003c/strong>. Le récepteur garde sa politique locale.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9989\" target=\"_blank\" rel=\"noopener\">RFC 9989\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>1 min. Alignement strict : domaines identiques ; relâché : même domaine organisationnel. La RFC 9989 remplace 7489 et 9091 depuis 2026. Déployer progressivement après inventaire des flux, en observant les rapports.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Authentique ne veut pas dire souhaité", "layer": 3, "visual": "reputation", "focus": "2/reputation", "beats": [{"path": "2/reputation/ip", "label": "IP · domaines"}, {"path": "2/reputation/plaintes", "label": "Plaintes · volumes"}, {"path": "2/filtres/contenu", "label": "Liens · contenu"}], "notes": "\u003ch2>Authentique ne veut pas dire souhaité\u003c/h2>\u003cdiv class=\"prose\">\u003cp>Un message envoyé avec un compte compromis peut avoir \u003cstrong>SPF, DKIM et DMARC valides\u003c/strong>.\u003c/p>\u003cp>Le service de réception évalue aussi la \u003cstrong>réputation des IP et domaines\u003c/strong>, les plaintes, les volumes, les liens, les pièces jointes et le contenu.\u003c/p>\u003cp>Un domaine ressemblant au vôtre peut authentifier ses propres messages. Le nom affiché peut aussi être trompeur.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9989\" target=\"_blank\" rel=\"noopener\">RFC 9989\u003c/a> · \u003ca href=\"https://support.google.com/mail/answer/81126\" target=\"_blank\" rel=\"noopener\">Consignes Gmail\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>1 min. Séparer authentification, réputation et détection du phishing. Les signaux et pondérations dépendent du fournisseur ; aucune recette ne garantit la boîte principale.\u003c/p>\u003c/aside>", "annex": false}, {"name": "La délivrabilité se construit", "layer": 3, "visual": "delivery", "focus": "2/reputation", "beats": [{"path": "1/dns/ptr", "label": "Reverse DNS"}, {"path": "1/pratiques", "label": "Pratiques d’envoi"}, {"path": "1/pratiques/suivi", "label": "Suivi des échecs"}], "notes": "\u003ch2>La délivrabilité se construit\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>Infrastructure :\u003c/strong> DNS cohérent, reverse DNS, TLS, flux autorisés et authentifiés.\u003c/p>\u003cp>\u003cstrong>Pratiques :\u003c/strong> destinataires qui attendent le message, adresses entretenues, volumes maîtrisés, traitement des échecs et désabonnement simple.\u003c/p>\u003cp>\u003cstrong>Observation :\u003c/strong> réponses SMTP, files, rapports DMARC et outils de réputation des fournisseurs.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://support.google.com/mail/answer/81126\" target=\"_blank\" rel=\"noopener\">Consignes Gmail\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc9989\" target=\"_blank\" rel=\"noopener\">RFC 9989\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>1 min. Pour une collectivité : inventorier aussi les logiciels métier, prestataires, copieurs, formulaires et plateformes de campagnes. Les recommandations fournisseur ne sont pas des règles universelles de SMTP.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Se désabonner sans friction", "layer": 3, "visual": "unsubscribe", "focus": "1/pratiques", "beats": [{"path": "1/pratiques/desabo", "label": "Désabonnement"}, {"path": "1/pratiques/desabo/post", "label": "POST HTTPS"}, {"path": "1/pratiques/desabo/dkim", "label": "En-têtes signés"}], "notes": "\u003ch2>Se désabonner sans friction\u003c/h2>\u003cdiv class=\"prose\">\u003cp>Pour les campagnes et listes, le corps présente un \u003cstrong>lien visible\u003c/strong>. Les en-têtes peuvent aussi permettre au logiciel d’afficher son bouton de désabonnement.\u003c/p>\u003cpre>\u003ccode>List-Unsubscribe: &lt;https://example.org/u/jeton&gt;\nList-Unsubscribe-Post: List-Unsubscribe=One-Click\u003c/code>\u003c/pre>\u003cp>Le one-click standard utilise un \u003cstrong>POST HTTPS\u003c/strong>. Une signature DKIM valide doit couvrir ces deux en-têtes.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc8058\" target=\"_blank\" rel=\"noopener\">RFC 8058\u003c/a> · \u003ca href=\"https://support.google.com/mail/answer/81126\" target=\"_blank\" rel=\"noopener\">Consignes Gmail\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>45 s. La visite GET d’un robot ne doit pas déclencher ce mécanisme. Le jeton identifie l’abonnement ; ne pas imposer une connexion. Gmail applique des exigences spécifiques aux envois en masse concernés, distinctes des obligations légales, hors périmètre ici.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Le récepteur décide du traitement", "layer": 3, "visual": "filter", "focus": "2/filtres", "beats": [{"path": "2/filtres/smtp", "label": "Décision SMTP"}, {"path": "2/boite/spam", "label": "Indésirables"}, {"path": "2/boite/quarantaine", "label": "Quarantaine"}], "notes": "\u003ch2>Le récepteur décide du traitement\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>Avant acceptation :\u003c/strong> le service peut refuser ou différer pendant le dialogue SMTP.\u003c/p>\u003cp>\u003cstrong>Après acceptation :\u003c/strong> il peut distribuer en boîte principale, classer dans les indésirables ou mettre en quarantaine selon sa politique.\u003c/p>\u003cp>Les contrôles peuvent être répartis entre une passerelle, un antivirus, un filtre et le serveur de boîte aux lettres.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5321\" target=\"_blank\" rel=\"noopener\">RFC 5321\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc5598\" target=\"_blank\" rel=\"noopener\">RFC 5598\u003c/a> · \u003ca href=\"https://support.google.com/mail/answer/81126\" target=\"_blank\" rel=\"noopener\">Consignes Gmail\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>45 s. Les contrôles ne surviennent pas tous après réception du corps : IP et SPF peuvent être évalués plus tôt ; DKIM nécessite les éléments du message. Ne pas présenter la carte comme un ordre d’exécution universel.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Bob consulte la copie stockée", "layer": 3, "visual": "reading", "focus": "3/lecture", "beats": [{"path": "3/lecture/imap/sync", "label": "Synchronisation"}, {"path": "3/lecture/web/https", "label": "HTTPS"}, {"path": "3/lecture/pop", "label": "POP3"}], "notes": "\u003ch2>Bob consulte la copie stockée\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>IMAP :\u003c/strong> l’application consulte et synchronise les messages, dossiers et états conservés sur le serveur.\u003c/p>\u003cp>\u003cstrong>Webmail :\u003c/strong> le navigateur échange en HTTPS avec le service, qui accède à la boîte. Il peut utiliser des protocoles internes ou des API.\u003c/p>\u003cp>\u003cstrong>POP3 :\u003c/strong> autre mode de récupération, avec conservation ou suppression selon les réglages. Répondre déclenche un nouvel envoi.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc9051\" target=\"_blank\" rel=\"noopener\">RFC 9051\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc1939\" target=\"_blank\" rel=\"noopener\">RFC 1939\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8314\" target=\"_blank\" rel=\"noopener\">RFC 8314\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>45 s. IMAP ne sert pas à transférer le mail entre les organisations. Les clients peuvent conserver une copie locale et travailler hors connexion. Des clients utilisent aussi des API propriétaires.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Le trajet complet, désormais concret", "layer": 3, "visual": "overview", "focus": "", "beats": [], "notes": "\u003ch2>Le trajet complet, désormais concret\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>Préparer :\u003c/strong> en-têtes, corps MIME et enveloppe distincte.\u003c/p>\u003cp>\u003cstrong>Acheminer :\u003c/strong> soumission autorisée, DNS/MX, relais SMTP, file d’attente et TLS.\u003c/p>\u003cp>\u003cstrong>Évaluer :\u003c/strong> SPF, DKIM, DMARC, réputation, antispam et antivirus ; décider du traitement.\u003c/p>\u003cp>\u003cstrong>Consulter :\u003c/strong> une copie stockée, via IMAP, webmail ou autre accès du service.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5598\" target=\"_blank\" rel=\"noopener\">RFC 5598\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>30 s. Dernière passe complète : le sujet est le même qu’à la première phrase, mais chaque mot a maintenant un mécanisme concret.\u003c/p>\u003c/aside>", "annex": false}, {"name": "« Le mail n’est pas arrivé » : où chercher ?", "layer": 3, "visual": "diagnostic", "focus": "", "beats": [], "notes": "\u003ch2>« Le mail n’est pas arrivé » : où chercher ?\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>1.\u003c/strong> Soumission : le service d’envoi a-t-il accepté le message ?\u003c/p>\u003cp>\u003cstrong>2.\u003c/strong> Acheminement : que disent la file, les logs et la réponse du serveur distant ?\u003c/p>\u003cp>\u003cstrong>3.\u003c/strong> Réception : refus, quarantaine, indésirables, règle de boîte ?\u003c/p>\u003cp>\u003cstrong>4.\u003c/strong> Consultation : bon compte, synchronisation, affichage ?\u003c/p>\u003cp>Conserver heure, adresses d’enveloppe et \u003cstrong>Message-ID\u003c/strong> ; corréler les identifiants de file entre relais.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5321\" target=\"_blank\" rel=\"noopener\">RFC 5321\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc5322\" target=\"_blank\" rel=\"noopener\">RFC 5322\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>1 min. Exemple oral : le serveur distant a répondu 250 final ; demander alors une trace côté réception plutôt que relancer aveuglément. Message-ID peut être absent, dupliqué ou falsifié : ce n’est pas une preuve d’identité.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Le mail est simple ; la confiance est distribuée", "layer": 3, "visual": "mail", "focus": "", "beats": [], "notes": "\u003ch2>Le mail est simple ; la confiance est distribuée\u003c/h2>\u003cdiv class=\"prose\">\u003cp>Un \u003cstrong>message structuré\u003c/strong>, transmis et stocké par des services qui suivent des standards communs.\u003c/p>\u003cp>Chaque acteur a un rôle, chaque contrôle une portée, chaque décision un endroit où laisser une trace.\u003c/p>\u003cp>\u003cstrong>Des questions ?\u003c/strong> Les annexes permettent de rouvrir une loupe.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5598\" target=\"_blank\" rel=\"noopener\">RFC 5598\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>30 s. Fin du parcours principal : environ 27 min avec les premières diapos. Ouvrir le sommaire pour les annexes, sans les imposer à la salle.\u003c/p>\u003c/aside>", "annex": false}, {"name": "Annexe · les ports à reconnaître", "layer": 3, "visual": "ports", "focus": "", "beats": [], "notes": "\u003ch2>Annexe · les ports à reconnaître\u003c/h2>\u003cdiv class=\"prose\">\u003cpre>\u003ccode>25   SMTP entre serveurs\n465  Soumission SMTP avec TLS implicite\n587  Soumission SMTP, généralement STARTTLS\n993  IMAP avec TLS implicite\n995  POP3 avec TLS implicite\n443  HTTPS : webmail / API\u003c/code>\u003c/pre>\u003cp>Ports usuels : la configuration réelle du service fait foi. SMTP AUTH sert à autoriser la soumission ; il ne remplace pas SPF, DKIM ou DMARC.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc8314\" target=\"_blank\" rel=\"noopener\">RFC 8314\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc6409\" target=\"_blank\" rel=\"noopener\">RFC 6409\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>À la demande. Éviter les ports 143/110 sans protection ; STARTTLS existe mais TLS implicite simplifie la politique côté accès.\u003c/p>\u003c/aside>", "annex": true}, {"name": "Annexe · lire les traces de confiance", "layer": 3, "visual": "results", "focus": "2/auth/resultats", "beats": [], "notes": "\u003ch2>Annexe · lire les traces de confiance\u003c/h2>\u003cdiv class=\"prose\">\u003cpre>\u003ccode>Authentication-Results: mx.example.net;\n spf=pass smtp.mailfrom=example.org;\n dkim=pass header.d=example.org;\n dmarc=pass header.from=example.org\u003c/code>\u003c/pre>\u003cp>Lire les \u003cstrong>Received\u003c/strong> de bas en haut pour reconstituer le trajet déclaré. Commencer par les traces ajoutées par ses propres services de confiance.\u003c/p>\u003cp>Une ligne plus ancienne peut avoir été fournie par l’émetteur. Les résultats ne valent que dans leur \u003cstrong>frontière de confiance\u003c/strong>.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc8601\" target=\"_blank\" rel=\"noopener\">RFC 8601\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc5321\" target=\"_blank\" rel=\"noopener\">RFC 5321\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>Exemple schématique. L’ordre inverse des Received reflète leur ajout en tête ; une chaîne complète n’est pas une preuve que tous les relais sont honnêtes.\u003c/p>\u003c/aside>", "annex": true}, {"name": "Annexe · redirections et listes", "layer": 3, "visual": "forward", "focus": "1/smtp", "beats": [{"path": "1/smtp/redirect", "label": "Redirection"}, {"path": "2/auth/arc", "label": "ARC"}], "notes": "\u003ch2>Annexe · redirections et listes\u003c/h2>\u003cdiv class=\"prose\">\u003cp>Une redirection change le serveur qui se connecte : \u003cstrong>SPF peut échouer\u003c/strong>. Réécrire l’enveloppe peut aider SPF sans assurer l’alignement DMARC.\u003c/p>\u003cp>DKIM peut survivre si les éléments signés sont préservés. Une liste qui modifie l’objet ou ajoute un pied de page peut invalider une signature.\u003c/p>\u003cp>\u003cstrong>ARC\u003c/strong> permet de transmettre une chaîne de résultats d’authentification ; le récepteur doit décider à quels intermédiaires se fier.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc7960\" target=\"_blank\" rel=\"noopener\">RFC 7960\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8617\" target=\"_blank\" rel=\"noopener\">RFC 8617\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>ARC ne transforme pas mécaniquement un échec DMARC en réussite ; il peut éclairer une décision locale. Les scénarios de listes sont un compromis d’interopérabilité.\u003c/p>\u003c/aside>", "annex": true}, {"name": "Annexe · DNS et SPF : les exceptions", "layer": 3, "visual": "exceptions", "focus": "1/dns", "beats": [], "notes": "\u003ch2>Annexe · DNS et SPF : les exceptions\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>Pas de MX :\u003c/strong> SMTP prévoit, sous conditions, un repli sur les adresses A / AAAA du domaine. \u003cstrong>MX 0 .\u003c/strong> annonce que le domaine ne reçoit pas de mail.\u003c/p>\u003cp>\u003cstrong>SPF :\u003c/strong> contrôle aussi HELO/EHLO ; une enveloppe vide utilise cette identité pour l’évaluation SPF. DMARC repose sur MAIL FROM selon sa spécification.\u003c/p>\u003cp>Les mécanismes SPF qui déclenchent des recherches DNS sont soumis à une \u003cstrong>limite de 10\u003c/strong> ; dépasser la limite peut produire permerror.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5321\" target=\"_blank\" rel=\"noopener\">RFC 5321\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc7505\" target=\"_blank\" rel=\"noopener\">RFC 7505\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc7208\" target=\"_blank\" rel=\"noopener\">RFC 7208\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc9989\" target=\"_blank\" rel=\"noopener\">RFC 9989\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>Le plafond ne signifie pas dix paquets DNS au total : mécanismes/modificateurs concernés et sous-limites sont précisés par SPF. Distinguer NXDOMAIN, absence de MX et Null MX.\u003c/p>\u003c/aside>", "annex": true}, {"name": "Annexe · chiffrement et encodage", "layer": 3, "visual": "crypto", "focus": "0/message/chiffrement", "beats": [], "notes": "\u003ch2>Annexe · chiffrement et encodage\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>Base64 :\u003c/strong> représentation de données binaires en caractères ; tout lecteur peut la décoder.\u003c/p>\u003cp>\u003cstrong>TLS :\u003c/strong> protection d’une connexion ; chaque terminaison accède aux données en clair.\u003c/p>\u003cp>\u003cstrong>S/MIME / OpenPGP :\u003c/strong> signature et/ou chiffrement du contenu selon le mode et les clés utilisés. Gestion des clés et compatibilité nécessaires.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc2045\" target=\"_blank\" rel=\"noopener\">RFC 2045\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8551\" target=\"_blank\" rel=\"noopener\">RFC 8551\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc9580\" target=\"_blank\" rel=\"noopener\">RFC 9580\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>Les métadonnées et possibilités de recherche/filtrage dépendent du format et de l’implémentation. Ne pas promettre la dissimulation de toutes les adresses.\u003c/p>\u003c/aside>", "annex": true}, {"name": "Annexe · les standards et la suite", "layer": 3, "visual": "sources", "focus": "", "beats": [], "notes": "\u003ch2>Annexe · les standards et la suite\u003c/h2>\u003cdiv class=\"prose\">\u003cp>\u003cstrong>Architecture et format :\u003c/strong> RFC 5598, 5322, 2045/2046.\u003c/p>\u003cp>\u003cstrong>Transport et accès :\u003c/strong> RFC 5321, 6409, 8314, 9051.\u003c/p>\u003cp>\u003cstrong>Confiance :\u003c/strong> RFC 7208, 6376, \u003cstrong>9989\u003c/strong> (DMARC, remplace 7489), 8601, 8058.\u003c/p>\u003cp>Chaque diapo cite ses sources. Les exigences des fournisseurs évoluent : vérifier leurs pages avant une campagne.\u003c/p>\u003c/div>\u003cp class=\"note sources\">\u003ca href=\"https://www.rfc-editor.org/rfc/rfc5598\" target=\"_blank\" rel=\"noopener\">RFC 5598\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc5322\" target=\"_blank\" rel=\"noopener\">RFC 5322\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc2045\" target=\"_blank\" rel=\"noopener\">RFC 2045\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc2046\" target=\"_blank\" rel=\"noopener\">RFC 2046\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc5321\" target=\"_blank\" rel=\"noopener\">RFC 5321\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc6409\" target=\"_blank\" rel=\"noopener\">RFC 6409\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8314\" target=\"_blank\" rel=\"noopener\">RFC 8314\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc9051\" target=\"_blank\" rel=\"noopener\">RFC 9051\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc7208\" target=\"_blank\" rel=\"noopener\">RFC 7208\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc6376\" target=\"_blank\" rel=\"noopener\">RFC 6376\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc9989\" target=\"_blank\" rel=\"noopener\">RFC 9989\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8601\" target=\"_blank\" rel=\"noopener\">RFC 8601\u003c/a> · \u003ca href=\"https://www.rfc-editor.org/rfc/rfc8058\" target=\"_blank\" rel=\"noopener\">RFC 8058\u003c/a> · \u003ca href=\"https://support.google.com/mail/answer/81126\" target=\"_blank\" rel=\"noopener\">Consignes Gmail\u003c/a>\u003c/p>\u003caside class=\"original-speaker\">\u003ch3>Notes de présentation\u003c/h3>\u003cp>Les RFC ont des statuts différents et peuvent être mises à jour : consulter leur fiche et leurs errata. Rapports DMARC : RFC 9990 et 9991.\u003c/p>\u003c/aside>", "annex": true}];
